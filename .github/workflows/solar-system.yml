name: solar-system workflow
on: 
    workflow_dispatch:
    push:
        branches:
          - main
          - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.username }}
    MONGO_PASSWORD: ${{ secrets.password }}
jobs: 
    unit-testing:
        name: unit-testing
        strategy:
            matrix:
                node-js-versions: [18,19,20]
                os: [ubuntu-latest,macos-latest]
                exclude:
                    - node-js-versions: 18
                      os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
          - name: checkout-repo
            uses: actions/checkout@v4
          - name: setup node
            uses: actions/setup-node@v6
            with: 
                node-version: ${{ matrix.node-js-versions }}
          - name: cache the dependencies
            uses: actions/cache@v4
            with:
                key: ${{ matrix.os }}-node_modules-${{ hashFiles('package-lock.json')}}
                path: node_modules
          - name: installing dependencies
            run: npm install
          - name: run unit tests
            run: npm test
          - name: save test results artifacts
            uses: actions/upload-artifact@v4
            with:
                name: results-${{ matrix.os }}-${{ matrix.node-js-versions }}
                path: test-results.xml
    coverage-testing:
        name: coverage-testing
        strategy:
            matrix:
                node-js-versions: [18,19,20]
                os: [ubuntu-latest,macos-latest]
                exclude:
                    - node-js-versions: 18
                      os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
          - name: checkout-repo
            uses: actions/checkout@v4
          - name: setup node
            uses: actions/setup-node@v6
            with: 
                node-version: ${{ matrix.node-js-versions }}
                
          # - name: cache the dependencies
          #   uses: actions/cache@v4
          #   with:
          #       key: ${{ matrix.os }}-node_modules-${{ hashFiles('package-lock.json')}}
          #       path: node_modules
          - name: installing dependencies
            run: npm install
          - name: run coverage tests
            continue-on-error: true
            run: npm run coverage
          - name: save coverage results artifacts
            uses: actions/upload-artifact@v4
            with:
                name: coverage_results-${{ matrix.os }}-${{ matrix.node-js-versions }}
                path: coverage