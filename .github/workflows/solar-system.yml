name: solar-system workflow
on: 
    workflow_dispatch:
    push:
        branches:
          - main
          - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.username }}
    MONGO_PASSWORD: ${{ secrets.password }}
jobs: 
    unit-testing:
        name: unit-testing
        strategy:
            matrix:
                node-js-versions: [18,19,20]
                os: [ubuntu-latest]
                # exclude:
                #     - node-js-versions: 18
                #       os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
          - name: checkout-repo
            uses: actions/checkout@v4
          - name: setup node
            uses: actions/setup-node@v6
            with: 
                node-version: ${{ matrix.node-js-versions }}
          - name: cache the dependencies
            uses: actions/cache@v4
            with:
                key: ${{ matrix.os }}-node_modules-${{ hashFiles('package-lock.json')}}
                path: node_modules
          - name: installing dependencies
            run: npm install
          - name: run unit tests
            run: npm test
          - name: save test results artifacts
            uses: actions/upload-artifact@v4
            with:
                name: results-${{ matrix.os }}-${{ matrix.node-js-versions }}
                path: test-results.xml
    coverage-testing:
        name: coverage-testing
        strategy:
            matrix:
                node-js-versions: [18,19,20]
                os: [ubuntu-latest]
                # exclude:
                #     - node-js-versions: 18
                #       os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
          - name: checkout-repo
            uses: actions/checkout@v4
          - name: setup node
            uses: actions/setup-node@v6
            with: 
                node-version: ${{ matrix.node-js-versions }}
          - name: cache the dependencies
            uses: actions/cache@v4
            with:
                key: ${{ matrix.os }}-node_modules-${{ hashFiles('package-lock.json')}}
                path: node_modules
          - name: installing dependencies
            run: npm install
          - name: run coverage tests
            continue-on-error: true
            run: npm run coverage
          - name: save coverage results artifacts
            uses: actions/upload-artifact@v4
            with:
                name: coverage_results-${{ matrix.os }}-${{ matrix.node-js-versions }}
                path: coverage
    docker:
        name: containerization
        needs: [unit-testing, coverage-testing]
        runs-on: ubuntu-latest
        permissions: 
          packages: write
        steps:
          - name: checkout-repo
            uses: actions/checkout@v4
          - name: Docker login
            uses: docker/login-action@v4
            with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
          - name: GHCR login
            uses: docker/login-action@v4
            with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}
          - name: build the image
            uses: docker/build-push-action@v7
            with:
              context: .
              push: false
              tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}
          - name: test the image
            run: |
              docker images
              docker run --name solar-system-app -d \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}
              export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
              echo $IP

              echo testing image url using wget
              wget -q -O - 127.0.0.1:3000/live | grep live
          - name: push the image
            uses: docker/build-push-action@v7
            with:
              context: .
              push: true
              tags: |
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}
                ghcr.io/${{ github.repository_owner }}/solar-system:${{github.sha}}
    connect_to_GKE:
        runs-on: ubuntu-latest
        needs: docker
        permissions:
          contents: read
          id-token: write   
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Authenticate with Google Cloud
            uses: google-github-actions/auth@v2
            with:
              workload_identity_provider: projects/1045795533938/locations/global/workloadIdentityPools/github-pool/providers/github-provider
              service_account: github-actions@project-fb312730-ed01-42b7-924.iam.gserviceaccount.com

          - name: Get GKE credentials
            uses: google-github-actions/get-gke-credentials@v2
            with:
              cluster_name: nodejs-cluster
              location: asia-south1-a
              project_id: project-fb312730-ed01-42b7-924

          - name: Verify cluster access
            run: |
              kubectl get nodes
          - name: Create namespace
            run: |
              kubectl create namespace solar-system \
              --dry-run=client -o yaml | kubectl apply -f -
          
          - name: Deploy to GKE
            env:
              NAMESPACE: solar-system
              REPLICAS: "2"
              K8S_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}
            run: |
              envsubst < kubernetes/development/*.yaml | kubectl apply -f -






